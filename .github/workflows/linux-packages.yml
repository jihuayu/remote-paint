name: Linux packages

on:
  workflow_dispatch:
    inputs:
      fresh_cache:
        description: 'Start fresh output without deleting any prior cache (required after rejected metadata)'
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'docker/**'
      - 'native/**'
      - 'tests/linux-package.test.mjs'
      - 'tests/test_ci_source_times.py'
      - 'tests/verify-packaged-launcher.mjs'
      - 'docs/linux-packages.md'

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ matrix.cpu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        cpu: [arm64, x64]
    env:
      TARGET_CPU: ${{ matrix.cpu }}
      CHROMIUM_OUTPUT: out/RemotePaintLinux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make room on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          mkdir -p build/chromium packages
          df -h .
      - name: Select strict build cache identity
        id: cache-key
        env:
          REMOTE_PAINT_CACHE_PROFILE: chromium-linux-${{ matrix.cpu }}-v3-${{ hashFiles('docker/**', 'native/*.mjs', 'native/*.args.gn', 'native/patches/**', 'native/chromium/**', 'native/broker/**') }}
        run: |
          printf 'prefix=%s-\nkey=%s-%s-%s\n' "$REMOTE_PAINT_CACHE_PROFILE" "$REMOTE_PAINT_CACHE_PROFILE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Restore incremental Chromium and Rust output
        id: cache
        if: inputs.fresh_cache != true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/chromium/src/${{ env.CHROMIUM_OUTPUT }}
            build/chromium/broker-target
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      - name: Build pinned Linux toolchain image
        run: |
          docker build --platform linux/amd64 -t remote-paint-build:ci -f docker/Dockerfile.build .
          docker build --platform linux/amd64 -t remote-paint-ci -f docker/Dockerfile.ci .
      - name: Verify byte-checked timestamp rehydration with real Ninja and C++
        timeout-minutes: 3
        run: |
          docker run --rm --init --network none --cpus 1 --memory 1g --pids-limit 128 \
            -v "$PWD:/project:ro" remote-paint-ci python3 /project/tests/test_ci_source_times.py
      - name: Sync pinned Chromium source and dependencies
        timeout-minutes: 65
        run: |
          docker run --rm --init -e TARGET_CPU -e CHROMIUM_OUTPUT \
            -v "$PWD:/project" -v "$PWD/build/chromium:/chromium" \
            remote-paint-ci bash /project/docker/ci-checkout.sh
      - name: Compile patched Chromium
        id: chromium
        timeout-minutes: 245
        run: |
          set -o pipefail
          docker run --name remote-paint-compile --init \
            --shm-size=2g -e TARGET_CPU -e CHROMIUM_OUTPUT -e BUILD_JOBS=4 -e REMOTE_PAINT_CI_SOURCE_TIMES=1 \
            -v "$PWD:/project" -v "$PWD/build/chromium:/chromium" \
            remote-paint-ci sh /project/docker/build-linux.sh 2>&1 | tee chromium-build.log
      - name: Build Broker and create standalone package
        id: package
        if: success()
        timeout-minutes: 15
        run: |
          docker run --rm --init -e TARGET_CPU -e CHROMIUM_OUTPUT -e BUILD_JOBS=4 \
            -v "$PWD:/project" -v "$PWD/build/chromium:/chromium" -v "$PWD/packages:/packages" \
            remote-paint-ci bash /project/docker/ci-package.sh
      - name: Save incremental output even after a compile timeout
        if: always() && (steps.cache.outcome == 'success' || inputs.fresh_cache == true)
        run: |
          docker stop --time 20 remote-paint-compile || true
          sudo chown -R "$(id -u):$(id -g)" build/chromium/src/out build/chromium/broker-target 2>/dev/null || true
      - name: Preserve build cache
        if: always() && (steps.cache.outcome == 'success' || inputs.fresh_cache == true)
        uses: actions/cache/save@v4
        with:
          path: |
            build/chromium/src/${{ env.CHROMIUM_OUTPUT }}
            build/chromium/broker-target
          key: ${{ steps.cache-key.outputs.key }}
      - name: Upload Linux package and checksum
        id: upload
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: remote-paint-linux-${{ matrix.cpu == 'x64' && 'x86_64' || 'arm64' }}
          path: |
            packages/*.tar.gz
            packages/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Record downloadable package
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '### Linux %s\n\n[Download server package and checksums](%s)\n\nIncludes custom Chromium, Rust Broker, Node.js and Viewer. Check the matching smoke job before deploying.\n' "$TARGET_CPU" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ matrix.cpu }}
          path: |
            chromium-build.log
            build/chromium/src/${{ env.CHROMIUM_OUTPUT }}/remote-paint-source-inputs-v1.json.gz
            build/chromium/src/${{ env.CHROMIUM_OUTPUT }}/remote-paint-source-recipe-v1.json
            build/chromium/src/${{ env.CHROMIUM_OUTPUT }}/remote-paint-ninja-diagnostics.log
            build/chromium/src/${{ env.CHROMIUM_OUTPUT }}/remote-paint-ninja-diagnostics.json
            build/chromium/src/${{ env.CHROMIUM_OUTPUT }}/remote-paint-build.json
          if-no-files-found: warn
          retention-days: 14

  smoke:
    name: Run packaged Linux ${{ matrix.cpu }}
    needs: build
    # A failed architecture must not prevent verification of a package that
    # the other architecture actually produced. Missing packages fail download.
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x86_64
            runner: ubuntu-24.04
          - cpu: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: remote-paint-linux-${{ matrix.cpu }}
          path: packages
      - name: Verify and extract archive
        run: |
          cd packages
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd remote-paint-linux-*/
          sha256sum -c SHA256SUMS
      - name: Run serializer and native browser capture from extracted package
        run: |
          docker build -t remote-paint-runtime -f docker/Dockerfile.runtime .
          package=$(find "$PWD/packages" -mindepth 1 -maxdepth 1 -type d -name 'remote-paint-linux-*')
          mkdir -p smoke-artifacts
          docker run --rm --init --shm-size=2g \
            -v "$package:/package:ro" -v "$PWD/smoke-artifacts:/package/app/artifacts" \
            -w /package/app \
            -e REMOTE_PAINT_CHROMIUM=/package/browser/headless_shell \
            -e CHROME_EXECUTABLE_PATH=/package/browser/headless_shell \
            -e REMOTE_PAINT_BROKER=/package/app/native/bin/remote-paint-broker \
            remote-paint-runtime sh -c \
              'cd /package/browser && ./serializer_tests && cd /package/app && /package/node/bin/node tests/verify-packaged-launcher.mjs /package && /package/node/bin/node tests/verify-native.mjs && /package/node/bin/node tests/verify-live.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux-${{ matrix.cpu }}
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14
