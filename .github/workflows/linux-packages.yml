name: Linux packages

on:
  workflow_dispatch:
    inputs:
      fresh_cache:
        description: 'Start fresh output without deleting any prior cache (required after rejected metadata)'
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/linux-packages.yml'
      - '.github/workflows/linux-package-architecture.yml'
      - 'docker/**'
      - 'native/**'
      - 'tests/linux-package.test.mjs'
      - 'tests/test_ci_source_times.py'
      - 'tests/verify-packaged-launcher.mjs'
      - 'docs/linux-packages.md'
      - 'deploy/**'
      - '.dockerignore'
      - 'live/private-cdp.mjs'
      - 'live.mjs'
      - 'live/source.mjs'
      - 'service/container-*.mjs'
      - 'docs/docker-private-cdp.md'
      - 'tests/private-cdp.test.mjs'
      - 'tests/distribution-policy.test.mjs'
      - 'tests/verify-container-cdp.mjs'
      - 'ci/compile-budget.mjs'
      - 'tests/compile-budget.test.mjs'
      - 'ci/restore-cipd-layout.py'
      - 'tests/test_ci_cipd_layout.py'
      - 'ci/Dockerfile.ccache'
      - 'ci/ccache*'
      - 'tests/test_ci_ccache_stats.py'
      - 'tests/test_ci_ccache_prepare.py'

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  architecture:
    name: Linux ${{ matrix.cpu }}
    strategy:
      fail-fast: false
      matrix:
        cpu: [arm64, x64]
    uses: ./.github/workflows/linux-package-architecture.yml
    with:
      build_cpu: ${{ matrix.cpu }}
      fresh_cache: ${{ inputs.fresh_cache || false }}
