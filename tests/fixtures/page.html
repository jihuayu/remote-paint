<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Remote Paint fixture</title>
<style>
@font-face { font-family: Fixture; src: url('/fixture/NotoSansSC-subset.ttf'); }
* { box-sizing: border-box; }
body { margin: 0; background: #f1f5f9; color: #14223b; font: 16px Fixture; }
header { background: #14223b; color: white; padding: 26px 36px; border-bottom: 4px solid #4be0ad; }
h1 { margin: 0 0 8px; font: 32px Fixture; } p { margin: 8px 0; }
main { padding: 28px 36px; } .row { display: flex; gap: 24px; }
article { padding: 22px; background: white; border: 1px solid #d4dfeb; border-radius: 12px; }
.text { flex: 1; } .image { width: 240px; } h2 { margin: 0 0 12px; font: 22px Fixture; }
img { width: 194px; height: 140px; border-radius: 8px; }
label { display: block; margin: 20px 0 8px; }
input, button { font: 16px Fixture; padding: 10px 14px; border: 1px solid #8193ab; border-radius: 6px; }
input { width: 290px; color: #14223b; background: white; }
button { color: white; background: #126c56; margin-left: 8px; }
footer { margin-top: 24px; padding: 16px; background: #e0f1eb; border-left: 4px solid #126c56; }
</style>
<header><h1>Remote Paint / 远程绘制</h1><p>服务器执行网页 · 客户端重放</p></header>
<main>
  <div class="row">
    <article class="text"><h2>中文文字 / Skia Picture</h2>
      <p>静态快照 · 本地字体 · 图片资源</p>
      <p>Text, paths, rounded borders and form controls.</p>
      <svg width="330" height="70" viewBox="0 0 330 70"><path d="M4 56 Q62 4 112 36 T220 27 T326 10" fill="none" stroke="#126c56" stroke-width="5"/><circle cx="112" cy="36" r="7" fill="#ff9c42"/></svg>
      <label for="text">输入 / Input</label><input id="text" value="中文测试"><button id="confirm">确认</button>
    </article>
    <article class="image"><h2>PNG image</h2><img src="/fixture/sample.png" alt="Raster image fixture"><p>194 x 140 pixels</p></article>
  </div>
  <footer>SKP → WebSocket → CanvasKit WASM<br>不传输原始页面 HTML / JS</footer>
</main>
</html>
